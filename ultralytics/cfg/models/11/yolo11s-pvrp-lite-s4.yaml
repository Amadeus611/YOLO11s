# YOLO11-PVRP-Lite, small-point 4 only: selective slim of P4/P5 neck.
# P4/P5 neck C3k2 blocks use e=0.25; P3 FPN remains at the default e=0.5.
# Pairs with yolo11-pvrp-lite-s5.yaml (reallocation only) for ablation.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [2, 3, P2Proxy, [128, False, 0.5]]              # 11
  - [-1, 1, AntiAliasDown, [128]]                   # 12

  - [10, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [512, False, 0.25]]               # 15  P4 FPN (slim)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4], 1, Concat, [1]]                        # 17
  - [-1, 2, C3k2, [256, False]]                     # 18  P3 FPN (default)

  - [[12, 18], 1, SemanticGatedFuse, [256]]         # 19
  - [-1, 1, NeighborDecoupleAdapter, [256]]         # 20

  - [19, 1, Conv, [256, 3, 2]]                      # 21
  - [[-1, 15], 1, Concat, [1]]                       # 22
  - [-1, 2, C3k2, [512, False, 0.25]]               # 23  P4 PAN (slim)

  - [-1, 1, Conv, [512, 3, 2]]                      # 24
  - [[-1, 10], 1, Concat, [1]]                       # 25
  - [-1, 2, C3k2, [1024, True, 0.25]]               # 26  P5 PAN (slim)

  - [[20, 23, 26], 1, Detect, [nc]]                 # 27
