# PVRP ablation: small-points 1+3
# Enables the P2Proxy detail branch with a naive 3-way concat (same as s1),
# plus the NeighborDecoupleAdapter on the P3 head input (same as s3).
# SemanticGatedFuse is *not* enabled, isolating the combined contribution of
# detail recovery and neighbor decoupling.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  # --- (1) P2 proxy branch ---
  - [2, 3, P2Proxy, [128, False, 0.5]]              # 11
  - [-1, 1, AntiAliasDown, [128]]                   # 12

  # --- FPN (P5 -> P3); naive 3-way concat at P3 ---
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [512, False]]                     # 15  P4 FPN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4, 12], 1, Concat, [1]]                   # 17  3-way concat
  - [-1, 2, C3k2, [256, False]]                     # 18  P3 FPN (shared by PAN and NDA)

  # --- (3) Neighbor decouple for P3 head only ---
  - [-1, 1, NeighborDecoupleAdapter, [256]]         # 19  P3 head input

  # --- PAN from pre-NDA P3 (L18) ---
  - [18, 1, Conv, [256, 3, 2]]                      # 20
  - [[-1, 15], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [512, False]]                     # 22  P4 PAN

  - [-1, 1, Conv, [512, 3, 2]]                      # 23
  - [[-1, 10], 1, Concat, [1]]                       # 24
  - [-1, 2, C3k2, [1024, True]]                     # 25  P5 PAN

  - [[19, 22, 25], 1, Detect, [nc]]                 # 26
