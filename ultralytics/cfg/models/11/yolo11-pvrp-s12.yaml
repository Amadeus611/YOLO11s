# PVRP ablation: small-points 1+2 (also serves as the "small-point 2 only"
# operating mode, since SemanticGatedFuse requires the P2 proxy as its low-level
# input and cannot run without small-point 1).
# Enables the P2Proxy detail branch and the SemanticGatedFuse at the P3 FPN
# stream, but *not* the NeighborDecoupleAdapter.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2  <-- P2 proxy source
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  # --- (1) P2 proxy branch ---
  - [2, 1, P2Proxy, [128, False, 0.5]]              # 11  proxy @ P2/4
  - [-1, 1, AntiAliasDown, [128]]                   # 12  proxy @ P3/8

  # --- Standard FPN (P5 -> P3) ---
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [512, False]]                     # 15  P4 FPN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4], 1, Concat, [1]]                        # 17
  - [-1, 2, C3k2, [256, False]]                     # 18  P3 FPN (pre-SGF)

  # --- (2) Semantic-gated proxy fusion ---
  - [[12, 18], 1, SemanticGatedFuse, [256]]         # 19  enhanced P3

  # --- PAN from enhanced P3 (no NDA in this ablation) ---
  - [-1, 1, Conv, [256, 3, 2]]                      # 20
  - [[-1, 15], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [512, False]]                     # 22  P4 PAN

  - [-1, 1, Conv, [512, 3, 2]]                      # 23
  - [[-1, 10], 1, Concat, [1]]                       # 24
  - [-1, 2, C3k2, [1024, True]]                     # 25  P5 PAN

  - [[19, 22, 25], 1, Detect, [nc]]                 # 26
