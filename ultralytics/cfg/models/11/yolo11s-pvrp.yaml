# YOLO11 with P2-Proxy Guided Fine-Grained Vehicle Recovery Pyramid (PVRP, full).
# Enables all three sub-modules of the main innovation:
#   (1) P2Proxy detail branch drawn from backbone L2 (C3k2 @ P2/4).
#   (2) SemanticGatedFuse injecting the proxy into the P3 FPN branch after the
#       standard neck concat, gated by high-level semantics to suppress BG.
#   (3) NeighborDecoupleAdapter on the P3 head input only (PAN stream uses the
#       pre-NDA feature so the adapter never disturbs downstream fusion).
# Baseline backbone (L0-L10) is identical to yolo11.yaml.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2  <-- P2 proxy source
  - [-1, 1, Conv, [256, 3, 2]]           # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4  P3 backbone
  - [-1, 1, Conv, [512, 3, 2]]           # 5  P4/16
  - [-1, 2, C3k2, [512, True]]           # 6  P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]]          # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  # --- (1) P2 proxy branch (P2/4) ---
  - [2, 3, P2Proxy, [128, False, 0.5]]              # 11  proxy @ P2/4
  - [-1, 1, AntiAliasDown, [128]]                   # 12  proxy @ P3/8

  # --- Standard FPN (P5 -> P3) ---
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [512, False]]                     # 15  P4 FPN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4], 1, Concat, [1]]                        # 17
  - [-1, 2, C3k2, [256, False]]                     # 18  P3 FPN (pre-SGF)

  # --- (2) Semantic-gated proxy fusion ---
  - [[12, 18], 1, SemanticGatedFuse, [256]]         # 19  enhanced P3

  # --- (3) Neighbor decouple for P3 head only ---
  - [-1, 1, NeighborDecoupleAdapter, [256]]         # 20  P3 head input

  # --- PAN (P3 -> P5), starts from the enhanced P3 (L19, pre-NDA) ---
  - [19, 1, Conv, [256, 3, 2]]                      # 21
  - [[-1, 15], 1, Concat, [1]]                       # 22
  - [-1, 2, C3k2, [512, False]]                     # 23  P4 PAN

  - [-1, 1, Conv, [512, 3, 2]]                      # 24
  - [[-1, 10], 1, Concat, [1]]                       # 25
  - [-1, 2, C3k2, [1024, True]]                     # 26  P5 PAN

  - [[20, 23, 26], 1, Detect, [nc]]                 # 27
