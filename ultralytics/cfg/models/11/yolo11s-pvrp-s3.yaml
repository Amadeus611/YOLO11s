# PVRP ablation: small-point 3 only (NeighborDecoupleAdapter).
# No P2 proxy, no SemanticGatedFuse. The adapter is attached as a sibling
# branch after the standard P3 FPN C3k2 so the downstream PAN still sees the
# pre-adapter feature. This isolates the contribution of local-contrast gating
# for near-neighbor decoupling.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12
  - [-1, 2, C3k2, [512, False]]                     # 13  P4 FPN

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15
  - [-1, 2, C3k2, [256, False]]                     # 16  P3 FPN (shared by PAN and NDA)

  # --- (3) Neighbor decouple for P3 head only ---
  - [-1, 1, NeighborDecoupleAdapter, [256]]         # 17  P3 head input

  # --- PAN starts from the pre-NDA P3 (L16), so NDA does not bleed into P4/P5 ---
  - [16, 1, Conv, [256, 3, 2]]                      # 18
  - [[-1, 13], 1, Concat, [1]]                       # 19
  - [-1, 2, C3k2, [512, False]]                     # 20  P4 PAN

  - [-1, 1, Conv, [512, 3, 2]]                      # 21
  - [[-1, 10], 1, Concat, [1]]                       # 22
  - [-1, 2, C3k2, [1024, True]]                     # 23  P5 PAN

  - [[17, 20, 23], 1, Detect, [nc]]                 # 24
