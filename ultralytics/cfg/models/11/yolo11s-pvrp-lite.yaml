# YOLO11-PVRP-Lite: full PVRP main innovation + small-target-first selective
# slim & reallocation (secondary innovation).
#
# Secondary innovation:
#   (s4) Selective slim: P4/P5 neck C3k2 blocks use e=0.25 (half hidden width).
#   (s5) Reallocation:   P3 FPN C3k2 block uses e=0.75 (enlarged hidden width).
# The backbone is *unchanged* vs. yolo11.yaml so pretrained yolo11s.pt can
# partially restore it. The PAN P4/P5 blocks also shrink because they feed the
# P4 and P5 detection heads only, where UAV vehicle density is lowest.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2  <-- P2 proxy source
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  # --- PVRP (1) P2 proxy ---
  - [2, 1, P2Proxy, [128, False, 0.5]]              # 11
  - [-1, 1, AntiAliasDown, [128]]                   # 12

  # --- FPN (P5 -> P3); P4 FPN is SLIMMED (e=0.25) ---
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]      # 13
  - [[-1, 6], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [512, False, 0.25]]               # 15  P4 FPN (slim)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 16
  - [[-1, 4], 1, Concat, [1]]                        # 17
  - [-1, 2, C3k2, [256, False, 0.75]]               # 18  P3 FPN (reallocated)

  # --- PVRP (2) Semantic-gated proxy fusion ---
  - [[12, 18], 1, SemanticGatedFuse, [256]]         # 19

  # --- PVRP (3) Neighbor decouple for P3 head only ---
  - [-1, 1, NeighborDecoupleAdapter, [256]]         # 20

  # --- PAN (P3 -> P5); P4/P5 PAN SLIMMED ---
  - [19, 1, Conv, [256, 3, 2]]                      # 21
  - [[-1, 15], 1, Concat, [1]]                       # 22
  - [-1, 2, C3k2, [512, False, 0.25]]               # 23  P4 PAN (slim)

  - [-1, 1, Conv, [512, 3, 2]]                      # 24
  - [[-1, 10], 1, Concat, [1]]                       # 25
  - [-1, 2, C3k2, [1024, True, 0.25]]               # 26  P5 PAN (slim)

  - [[20, 23, 26], 1, Detect, [nc]]                 # 27
